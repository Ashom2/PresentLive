<!-- Mockup partially generated by DeepSeek AI -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PresentLive · simple mockups</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 2rem;
    }
    .app-header {
      background: #0b1b3a;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }
    .app-header h3 {
      color: white;
      margin: 0;
    }
    .page-box {
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .page-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #0b1b3a;
    }
    .simple-border {
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .bar {
      background: #6c8cff;
      border-radius: 4px 4px 0 0;
      width: 24px;
    }
  </style>
</head>
<body>
  <div id="root" class="container py-4"></div>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    // ----- simple page wrapper (title optional) -----
    const Page = ({ title, children }) => (
      <div className="page-box">
        {title && <div className="page-title">{title}</div>}
        {children}
      </div>
    );

    // ----- Landing page -----
    const LandingPage = ({ onNavigate }) => (
      <Page>
        <p className="text-muted mb-4">Create, share, and present slide decks in the browser.</p>
        <div className="row g-3">
          <div className="col-md-6">
            <div className="simple-border">
              <h6 className="fw-semibold">Join a presentation</h6>
              <p className="small text-muted mb-2">Enter the presentation link or code</p>
              <div className="input-group mb-2">
                <input className="form-control form-control-sm" placeholder="e.g. presentlive/example-deck" />
                <button className="btn btn-sm btn-primary" onClick={() => onNavigate('audience')}>Join</button>
              </div>
            </div>
          </div>
          <div className="col-md-6">
            <div className="simple-border">
              <h6 className="fw-semibold">Manage presentations</h6>
              <p className="small text-muted mb-2">Edit or present a deck you own</p>
              <div className="d-flex gap-2">
                <button className="btn btn-sm btn-outline-primary" onClick={() => onNavigate('manage')}>My presentations</button>
                <button className="btn btn-sm btn-primary" onClick={() => onNavigate('editor')}>+ New presentation</button>
              </div>
            </div>
          </div>
        </div>
      </Page>
    );

    // ----- Manage presentations page -----
    const ManagePage = ({ onNavigate }) => {
      const decks = [
        { title: 'Introduction to COMP2140', status: 'Published' },
        { title: 'Q3 Product Roadmap', status: 'Draft' },
        { title: 'Employee Survey', status: 'Published' },
      ];
      return (
        <Page title="My presentations">
          <div className="d-flex justify-content-between mb-3">
            <button className="btn btn-sm btn-outline-secondary" onClick={() => onNavigate('landing')}>← Back</button>
            <button className="btn btn-sm btn-primary" onClick={() => onNavigate('editor')}>+ New presentation</button>
          </div>
          <div className="d-flex flex-column gap-2">
            {decks.map((d, i) => (
              <div key={i} className="simple-border d-flex justify-content-between align-items-center">
                <div>
                  <span className="fw-semibold">{d.title}</span>
                  <span className="badge bg-light text-dark border ms-2">{d.status}</span>
                </div>
                <div className="d-flex gap-1">
                  <button className="btn btn-sm btn-outline-primary" onClick={() => onNavigate('editor')}>Edit</button>
                  <button className="btn btn-sm btn-outline-success" onClick={() => onNavigate('audience')}>Present</button>
                </div>
              </div>
            ))}
          </div>
        </Page>
      );
    };

    // ----- Slide editor page -----
    const EditorPage = ({ onNavigate }) => (
      <Page title="Slide editor - Introduction to COMP2140">
        <div className="d-flex justify-content-between mb-3">
          <button className="btn btn-sm btn-outline-secondary" onClick={() => onNavigate('manage')}>← Back to presentations</button>
          <div className="d-flex gap-1">
            <button className="btn btn-sm btn-outline-primary">Save</button>
            <button className="btn btn-sm btn-outline-success" onClick={() => onNavigate('audience')}>Present</button>
          </div>
        </div>
        <div className="row g-3">
          <div className="col-md-4">
            <div className="simple-border">
              <div className="fw-semibold mb-2">Slides</div>
              <div className="d-flex flex-column gap-1 small">
                <div className="p-1 bg-light rounded">1. Title <span className="badge bg-secondary">Content</span></div>
                <div className="p-1 bg-light rounded">2. About Me <span className="badge bg-secondary">Content</span></div>
                <div className="p-1 bg-light rounded border border-warning">3. Poll: Experience <span className="badge bg-warning text-dark">Poll</span></div>
              </div>
              <button className="btn btn-sm btn-outline-secondary mt-2 w-100">+ Add slide</button>
            </div>
          </div>
          <div className="col-md-8">
            <div className="simple-border mb-2">
              <label className="small fw-semibold">Question</label>
              <input className="form-control form-control-sm mb-2" value="How familiar are you with JavaScript?" readOnly />
              <label className="small fw-semibold">Options</label>
              <div className="small">
                <div>• Not familiar</div>
                <div>• Beginner</div>
                <div>• Intermediate</div>
                <div>• Advanced</div>
              </div>
            </div>
            <div className="simple-border bg-light">
              <div className="small text-muted mb-1">presentMD preview</div>
              <div><span className="text-secondary">##</span> How familiar are you with JavaScript?</div>
              <div><span className="text-secondary">- [ ]</span> Not familiar</div>
              <div><span className="text-secondary">- [ ]</span> Beginner</div>
              <div><span className="text-secondary">- [ ]</span> Intermediate</div>
              <div><span className="text-secondary">- [ ]</span> Advanced</div>
            </div>
          </div>
        </div>
      </Page>
    );

    // ----- Audience view page -----
    const AudiencePage = ({ onNavigate }) => {
      const [selected, setSelected] = useState(null);
      const options = ['Not familiar', 'Beginner', 'Intermediate', 'Advanced'];
      const counts = [2, 5, 8, 3];
      const total = counts.reduce((a, b) => a + b, 0);

      return (
        <Page title="Audience view - slide 3 of 4">
          <div className="d-flex justify-content-between mb-3">
            <button className="btn btn-sm btn-outline-secondary" onClick={() => onNavigate('landing')}>← Exit presentation</button>
            <span className="small text-muted">Display name: Anonymous</span>
          </div>

          <div className="simple-border mb-3">
            <h6 className="fw-semibold">How familiar are you with JavaScript?</h6>
            {options.map((opt, i) => (
              <div key={i} className="form-check">
                <input className="form-check-input" type="radio" name="poll" id={`opt${i}`} checked={selected === i} onChange={() => setSelected(i)} />
                <label className="form-check-label" htmlFor={`opt${i}`}>{opt}</label>
              </div>
            ))}
            <button className="btn btn-sm btn-primary mt-2" disabled={selected === null}>Submit answer</button>
            {selected !== null && <span className="ms-2 small text-success">submitted (cannot change)</span>}
          </div>

          <div className="simple-border">
            <div className="fw-semibold mb-2">Live results · {total} responses</div>
            <div className="d-flex align-items-end gap-2" style={{ height: '70px' }}>
              {counts.map((c, i) => (
                <div key={i} className="d-flex flex-column align-items-center">
                  <div className="bar" style={{ height: `${(c / total) * 60}px` }}></div>
                  <span className="small mt-1">{options[i].substring(0, 3)}</span>
                  <span className="small fw-bold">{c}</span>
                </div>
              ))}
            </div>
          </div>
        </Page>
      );
    };

    // ----- Attendance / poll review page -----
    const ReviewPage = ({ onNavigate }) => {
      const attendees = [
        { name: 'John Doe', status: 'Finished', answers: ['Beginner'] },
        { name: 'Fred Bloggs', status: 'Finished', answers: ['Not familiar'] },
        { name: 'Peter Person', status: 'Finished', answers: ['Not familiar'] },
        { name: 'Mandy Management', status: 'Viewing', answers: ['Advanced'] },
        { name: 'Randy Random', status: 'Finished', answers: ['Intermediate'] },
      ];
      return (
        <Page title="Attendance & poll responses - Introduction to COMP2140">
          <div className="d-flex justify-content-between mb-3">
            <button className="btn btn-sm btn-outline-secondary" onClick={() => onNavigate('manage')}>← Back to presentations</button>
            <button className="btn btn-sm btn-outline-primary">Export CSV</button>
          </div>
          <table className="table table-sm table-bordered">
            <thead className="table-light">
              <tr>
                <th>Attendee</th>
                <th>Status</th>
                <th>Poll 1</th>
                <th>Poll 2</th>
                <th>Poll 3</th>
              </tr>
            </thead>
            <tbody>
              {attendees.map((a, i) => (
                <tr key={i}>
                  <td>{a.name}</td>
                  <td><span className={`badge ${a.status === 'Finished' ? 'bg-success' : 'bg-primary'}`}>{a.status}</span></td>
                  {a.answers.map((ans, j) => <td key={j}>{ans}</td>)}
                </tr>
              ))}
            </tbody>
          </table>
        </Page>
      );
    };

    // ----- Main App with simple state routing -----
    const App = () => {
      const [page, setPage] = useState('landing');
      const navigate = (p) => setPage(p);

      return (
        <div>
          <div className="app-header">
            <h3 className="fw-bold">PresentLive</h3>
          </div>

          {page === 'landing' && <LandingPage onNavigate={navigate} />}
          {page === 'manage' && <ManagePage onNavigate={navigate} />}
          {page === 'editor' && <EditorPage onNavigate={navigate} />}
          {page === 'audience' && <AudiencePage onNavigate={navigate} />}
          {page === 'review' && <ReviewPage onNavigate={navigate} />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
